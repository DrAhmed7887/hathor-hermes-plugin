name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  hermes-validate:
    # The same check the plugin catalog CI runs, against Hermes v0.23.0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hathor-catchup
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: v0.23.0
          path: hermes-agent
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes from its own lock file
        working-directory: hermes-agent
        run: uv sync --frozen --no-dev
      - name: hermes plugins validate
        working-directory: hermes-agent
        run: uv run --frozen hermes plugins validate "$GITHUB_WORKSPACE/hathor-catchup" --install-deps
      - name: hermes plugins doctor
        working-directory: hermes-agent
        run: uv run --frozen hermes plugins doctor "$GITHUB_WORKSPACE/hathor-catchup" --ci
